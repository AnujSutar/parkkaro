<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ajara Parking Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
  />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header, footer {
      background-color: #333;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h2 {
      margin: 0;
    }
    .home-button {
      background: none;
      border: 1px solid white;
      color: white;
      font-size: 16px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 5px;
      text-decoration: none;
    }
    .home-button:hover {
      background-color: white;
      color: #333;
    }
    .container {
      padding: 20px;
    }
    .location-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .location {
      flex: 1 1 calc(50% - 20px);
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .location button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    .location button:hover {
      background-color: #45a049;
    }
    .distance {
      font-size: 14px;
      color: #333;
      margin-left: 20px;
    }
    #map {
      height: 400px;
      width: 100%;
      margin-top: 20px;
    }
    .booking-section {
      background-color: #f0f8ff;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .booking-section h3 {
      margin-top: 0;
    }
    .booking-section form {
      display: grid;
      gap: 15px;
    }
    .booking-section input,
    .booking-section select {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 100%;
    }
    .booking-section button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .booking-section button:hover {
      background-color: #0056b3;
    }
    footer {
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h2>Parkaro - Ajara Map</h2>
    <a href="home.html" class="home-button">Home</a>
  </header>

  <div class="container">
    <div class="location-grid" id="locationList"></div>
    <div id="map"></div>

    <section class="booking-section">
      <h3>📅 Book a Private Parking Spot</h3>
      <form id="bookingForm">
        <label>Name:
          <input type="text" name="name" required />
        </label>
        <label>Phone:
          <input type="tel" name="phone" required pattern="[0-9]{10}" />
        </label>
        <label>Vehicle Number:
          <input type="text" name="vehicle" required />
        </label>
        <label>Date & Time:
          <input type="datetime-local" name="datetime" required />
        </label>
        <label>Select Location:
          <select name="location" required>
            <option value="">-- Select --</option>
            <option value="Ajara Bus Stand">Ajara Bus Stand</option>
            <option value="Ajara College">Ajara College</option>
            <option value="Ajara Market">Ajara Market</option>
          </select>
        </label>
        <button type="submit">Book Now</button>
      </form>
      <div id="ticket" style="margin-top:20px; display:none;"></div>
    </section>
  </div>

  <footer>
    This project is created for College Mega Project.
  </footer>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    const locations = [
      { name: "Ajara Bus Stand", lat: 16.1195, lng: 74.2135 },
      { name: "Ajara College", lat: 16.1230, lng: 74.2098 },
      { name: "Ajara Market", lat: 16.1222, lng: 74.2120 },
      { name: "Shri Ajara Maharaj Math", lat: 16.1205, lng: 74.2102 },
      { name: "Hanuman Mandir Ajara", lat: 16.1185, lng: 74.2111 }
    ];

    function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(2);
    }

    function displayLocations(lat, lng) {
      const container = document.getElementById("locationList");
      container.innerHTML = "";
      locations.forEach(loc => {
        const distance = getDistanceFromLatLonInKm(lat, lng, loc.lat, loc.lng);
        const div = document.createElement("div");
        div.className = "location";
        div.innerHTML = `
          <span>${loc.name}</span>
          <div>
            <span class="distance">${distance} km</span>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank">
              <button>Get Directions</button>
            </a>
          </div>
        `;
        container.appendChild(div);
      });
    }

    navigator.geolocation.getCurrentPosition(position => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      displayLocations(lat, lng);
      showMap(lat, lng);
    }, () => {
      alert("Location access denied. Using default location (Ajara)." );
      const lat = 16.1195, lng = 74.2135;
      displayLocations(lat, lng);
      showMap(lat, lng);
    });

    function showMap(lat, lng) {
      const map = L.map('map').setView([lat, lng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      locations.forEach(loc => {
        L.marker([loc.lat, loc.lng]).addTo(map)
          .bindPopup(loc.name);
      });
    }

    document.getElementById("bookingForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const form = new FormData(e.target);
      const ticket = `
        <h4>🎫 Booking Confirmed</h4>
        <p><strong>Name:</strong> ${form.get("name")}</p>
        <p><strong>Phone:</strong> ${form.get("phone")}</p>
        <p><strong>Vehicle:</strong> ${form.get("vehicle")}</p>
        <p><strong>Date/Time:</strong> ${form.get("datetime")}</p>
        <p><strong>Location:</strong> ${form.get("location")}</p>
        <a href="data:text/plain;charset=utf-8,${encodeURIComponent(`Booking Ticket\nName: ${form.get("name")}\nPhone: ${form.get("phone")}\nVehicle: ${form.get("vehicle")}\nDate/Time: ${form.get("datetime")}\nLocation: ${form.get("location")}`)}" download="ParkingTicket.txt">
          <button>Download Ticket</button>
        </a>
      `;
      const ticketDiv = document.getElementById("ticket");
      ticketDiv.innerHTML = ticket;
      ticketDiv.style.display = "block";
    });
  </script>
</body>
</html>
