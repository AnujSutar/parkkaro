<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ajara Parking Locations</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f0f4f7;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    .container {
      padding: 30px;
    }

    .location {
      background-color: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location button {
      background-color: #2980b9;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ajara Parking</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="live.html">Live Map</a>
    </nav>
  </header>

  <div class="container">
    <h2>Available Parking Locations in Ajara</h2>

    <!-- Example Location 1 -->
    <div class="location">
      <span>Ajara Bus Stand Parking</span>
      <button onclick="redirectToMap(16.1019, 74.2137)">Get Directions</button>
    </div>

    <!-- Example Location 2 -->
    <div class="location">
      <span>Market Yard Parking</span>
      <button onclick="redirectToMap(16.1025, 74.2152)">Get Directions</button>
    </div>

    <!-- Embedded Live Map -->
    <h3>Live Map of Ajara</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15115.874319432247!2d74.2040!3d16.1019!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc0b9fb5d6379fd%3A0x5e6e38b4e5088cc9!2sAjara%2C%20Maharashtra%20416505!5e0!3m2!1sen!2sin!4v1700000000000" allowfullscreen></iframe>
  </div>

  <script>
    function redirectToMap(lat, lng) {
      const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
