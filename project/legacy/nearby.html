        navigator.geolocation.getCurrentPosition(position => {
            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;
            map.setView([userLat, userLon], 14);

            currentLocationMarker = L.marker([userLat, userLon], { icon: L.divIcon({ className: 'user-icon', html: '📍' }) })

                .bindPopup('<b>Your Current Location</b>')
                .openPopup();
        }, () => {
            alert("Unable to fetch your location.");
        });

        // Add parking spots to map
        parkingSpots.forEach(spot => {
            L.marker([spot.lat, spot.lon])
                .addTo(map)
                .bindPopup(`<b>${spot.name}</b>`);
        });

        // Find nearest parking spot
        function findNearestParking() {
            navigator.geolocation.getCurrentPosition(position => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;

                let nearestSpot = null;
                let minDistance = Infinity;

                parkingSpots.forEach(spot => {
                    const distance = getDistance(userLat, userLon, spot.lat, spot.lon);
                    if (distance < minDistance) {
                        minDistance = distance;
                        nearestSpot = spot;
                    }
                });

                if (nearestSpot) {
                    alert(`Nearest Parking: ${nearestSpot.name} (${minDistance.toFixed(2)} km away)`);
                    map.setView([nearestSpot.lat, nearestSpot.lon], 15);
                    L.marker([nearestSpot.lat, nearestSpot.lon]).addTo(map).bindPopup(`<b>${nearestSpot.name}</b>`);
                }
            }, () => {
                alert("Unable to fetch your location.");
            });
        }

        // Skip to next parking spot
        function skipParking() {
            currentSpotIndex = (currentSpotIndex + 1) % parkingSpots.length;
            const nextSpot = parkingSpots[currentSpotIndex];
            alert(`Next Parking Spot: ${nextSpot.name}`);
            map.setView([nextSpot.lat, nextSpot.lon], 14);
        }

        // Calculate distance (Haversine formula)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = toRadians(lat2 - lat1);
            const dLon = toRadians(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) * Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function toRadians(deg) {
            return deg * (Math.PI / 180);
        }
